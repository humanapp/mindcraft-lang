name: Build graph

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, check and test every package and app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Registry tarballs only. Build output is deliberately not cached: the
      # post-build substitution moves its inputs out of dist into
      # .platform-emit, and three toolchains write one dist, so a partial
      # restore reproduces the dist_half_built state the freshness guard exists
      # to catch.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install every package and app
        run: npm install

      # The runner sets CI, which makes each loop run a package's check:only.
      - name: Packages
        run: npm run build --prefix packages

      - name: Apps
        run: npm run build --prefix apps

      - name: Assert a clean tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The build modified tracked files or left new ones behind:"
            git status --porcelain
            exit 1
          fi
