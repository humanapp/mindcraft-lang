name: Deploy vscode-extension

on:
  push:
    tags:
      - "wendoo-vscode-extension-v*"

permissions:
  contents: write

jobs:
  publish:
    name: Build, Lint, Publish & Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vscode-extension

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: "Rewrite public local file: deps to version ranges"
        working-directory: .
        run: node scripts/rewrite-local-deps.js apps/vscode-extension

      - name: Install dependencies
        run: npm ci

      - name: Lint & format check
        run: npm run check:only

      - name: Build
        run: npm run build

      - name: Verify package version matches tag
        run: |
          PACKAGE_VERSION="wendoo-vscode-extension-v$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Publish to VS Code Marketplace
        run: npm run publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
